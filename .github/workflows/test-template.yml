name: Test template

# Verifies rails-app-template itself (not a generated app's own CI, which
# each scaffolded app already gets from `rails new`). Scaffolds a small
# matrix of representative flag combinations and asserts each one boots
# cleanly in development, boots cleanly in production with eager loading on
# (the specific check that would have caught the lib/generators eager-load
# crash — see #12), and passes its own generated test suite.
#
# All matrix legs use --database=sqlite3 except "defaults" (postgresql, via
# the postgres service below) and "mysql-devise" (trilogy, via the mysql
# service below) — those are the combinations db_create.rb/db_credentials.rb
# exist for (Clearance's/Devise's install generators query the database
# directly while generating, and a non-default username/password has to
# reach config/database.yml, via .env, before that happens). Every CLI option is
# exercised by at least one leg; the full cross-product isn't (see #13).
# mariadb, bun/rollup and postcss are left out on purpose: our template
# code treats them the same as mysql, esbuild/webpack and sass.

on:
  pull_request:
  # Weekly run on main replaces the push-to-main run: branch protection requires
  # PRs to be up to date before merging, so main only gets tested code.
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

# A new push to a PR cancels its in-flight run; runs on main never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scaffold-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "p@ss:word#1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            database: postgresql
            expected_driver: selenium_headless_chrome
            extra_args: ""
          - name: devise-tailwind
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--auth=devise --css=tailwind"
          - name: rspec
            database: sqlite3
            expected_driver: cuprite
            # RSpec + cuprite; non-default-options covers Minitest + cuprite,
            # and the remaining legs Minitest + selenium.
            extra_args: "--test=rspec --system-test-driver=cuprite"
          - name: skip-admin-importmap
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--javascript=importmap --skip-admin"
          - name: mysql-devise
            database: trilogy
            expected_driver: selenium_headless_chrome
            extra_args: >-
              --auth=devise --db-username=app_user
              --db-password=p@ss:word#1
          - name: css-sass-fallback
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--css=sass --no-pagy"
          - name: javascript-webpack
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--javascript=webpack"
          # Every option no other leg covers. Keeps pagy on: bulma is the
          # only --css value that loads its own pagy extra (pagy.rb).
          - name: non-default-options
            database: sqlite3
            expected_driver: cuprite
            extra_args: >-
              --css=bulma --action-text --system-test-driver=cuprite
              --no-rack-attack --no-bullet --no-annotate --port=3999
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout rails-app-template
        uses: actions/checkout@v5
        with:
          path: rails-app-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Developers scaffold with Yarn 4, which takes ci_workflow.rb's
      # packageManager path; the image's default Yarn 1 would skip it.
      - name: Activate Yarn 4 via Corepack
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn --version

      - name: Install Rails
        run: gem install rails --no-document

      # A non-root user, so the scaffold exercises the DB_USERNAME path too.
      - name: Set up MySQL user and dummy socket
        if: matrix.name == 'mysql-devise'
        run: |
          docker exec ${{ job.services.mysql.id }} mysql -uroot -p'p@ss:word#1' -e \
            "CREATE USER 'app_user'@'%' IDENTIFIED BY 'p@ss:word#1'; GRANT ALL ON *.* TO 'app_user'@'%';"
          # Rails hardcodes the first socket path that exists (here a dummy
          # file), as on a Mac with Homebrew MySQL; db_credentials.rb must undo it.
          touch /tmp/mysql.sock

      # shell: bash adds pipefail, so tee can't hide a failed scaffold.
      - name: Scaffold app (${{ matrix.name }})
        shell: bash
        run: >-
          rails-app-template/bin/new-rails-app scaffold_app
          --no-interactive
          --database=${{ matrix.database }}
          ${{ matrix.extra_args }}
          2>&1 | tee "$RUNNER_TEMP/scaffold.log"

      # bin/rubocop is the last generator step, so notes must come after it.
      - name: Check instructions print at the end
        run: |
          log="$RUNNER_TEMP/scaffold.log"
          last_step=$(grep -nE '^ +run +bin/rubocop' "$log" | tail -1 | cut -d: -f1)
          [ -n "$last_step" ] || { echo "no 'run bin/rubocop' line in the scaffold log" >&2; exit 1; }
          tail -n "+$((last_step + 1))" "$log" > "$RUNNER_TEMP/tail.log"
          for note in 'Notes from (clearance|devise):install' 'default_url_options' 'is ready\.$'; do
            grep -qE "$note" "$RUNNER_TEMP/tail.log"
          done
          if head -n "$last_step" "$log" | grep -qE 'Next steps:|manual setup may be required'; then
            echo "install notes printed mid-run" >&2; exit 1
          fi
          # The next command to run must be the last thing on screen.
          tail -n 6 "$log" | grep -qE '^ +bin/dev$'

      # The app's own ci.yml never runs here; check ci_workflow.rb adapted it.
      # `! cmd` never trips bash -e, so negative checks exit explicitly.
      - name: Check generated CI workflow
        working-directory: scaffold_app
        run: |
          ci=.github/workflows/ci.yml
          if [ -d spec ]; then
            grep -qF 'run: bin/rails db:test:prepare test:prepare && bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"' "$ci"
            grep -qF 'run: bin/rails db:test:prepare test:prepare && bundle exec rspec spec/system' "$ci"
            if [ -d test ]; then echo "RSpec app still has a test/ dir" >&2; exit 1; fi
            # bin/ci leaves system specs to its optional step, as Minitest apps do.
            grep -qF "step \"Tests: RSpec\", \"bin/rails test:prepare && bundle exec rspec --exclude-pattern 'spec/system/**/*_spec.rb'\"" config/ci.rb
            grep -qF '# step "Tests: System", "bin/rails test:prepare && bundle exec rspec spec/system"' config/ci.rb
          else
            grep -qx '        run: bin/rails db:test:prepare test' "$ci"
            grep -qx '        run: bin/rails db:test:prepare test:system' "$ci"
            # bin/ci must keep Rails' own test steps; nothing else checks them.
            grep -qx '  step "Tests: Rails", "bin/rails test"' config/ci.rb
            grep -qx '  # step "Tests: System", "bin/rails test:system"' config/ci.rb
          fi
          if [ -f package.json ] && [ ! -f bun.lock ] && [ ! -f bun.lockb ]; then
            if [ "$(grep -c 'node-version-file: .node-version' "$ci")" != 2 ]; then
              echo "expected Node setup in both test jobs" >&2; exit 1
            fi
            if [ "$(grep -c 'npm install -g corepack && corepack enable' "$ci")" != 2 ]; then
              echo "expected Corepack in both test jobs" >&2; exit 1
            fi
            # Scaffolded with Yarn 4 (see above), so all three must reflect it.
            grep -q '^__metadata:' yarn.lock
            grep -qE '"packageManager": "yarn@4' package.json
            grep -qx '  step "Security: Yarn vulnerability audit", "yarn npm audit --recursive --no-deprecations"' config/ci.rb
          elif grep -q setup-node "$ci"; then
            echo "Node setup added to an app with no package.json" >&2; exit 1
          fi

      # The app's own CI lint job runs this; generator output must pass it too.
      - name: Lint generated app
        working-directory: scaffold_app
        run: bin/rubocop

      # Booting alone wouldn't notice an --no-* flag or --port being ignored.
      - name: Check non-default options took effect
        if: matrix.name == 'non-default-options'
        working-directory: scaffold_app
        run: |
          grep -qx "PORT=3999" .env
          grep -q '"cuprite"' Gemfile
          # `! cmd` never trips bash -e, so the negative check exits explicitly.
          if grep -qE '"(rack-attack|bullet|annotaterb)"' Gemfile; then
            echo "a --no-* gem is still in the Gemfile" >&2; exit 1
          fi
          ls db/migrate | grep -q create_active_storage_tables
          ls db/migrate | grep -q create_action_text_tables

      # Rails' own CI connects as root with no password, so with .env gone
      # (as on a fresh checkout) database.yml must fall back to exactly that.
      - name: Check MySQL credentials live in .env, not database.yml
        if: matrix.name == 'mysql-devise'
        working-directory: scaffold_app
        run: |
          grep -qx 'DB_USERNAME="app_user"' .env
          grep -qx 'DB_PASSWORD="p@ss:word#1"' .env
          if grep -q 'p@ss:word#1' config/database.yml; then
            echo "the MySQL password was written into config/database.yml" >&2; exit 1
          fi
          git check-ignore -q .env
          if grep -qE '^ +socket: /' config/database.yml; then
            echo "config/database.yml hardcodes this machine's MySQL socket" >&2; exit 1
          fi
          grep -qxF '  socket: <%= ENV["DB_SOCKET"]&.to_json %>' config/database.yml
          mv .env "$RUNNER_TEMP/dotenv"
          # A blank DB_USERNAME (half-edited .env) must fall back to root too.
          for username in unset ''; do
            ( [ "$username" = unset ] || export DB_USERNAME="$username"
              RAILS_ENV=test bin/rails runner '
                config = ActiveRecord::Base.connection_db_config.configuration_hash
                abort "fallback credentials: #{config.slice(:username, :password)}" unless config[:username] == "root" && config[:password].nil?
                abort "connection: #{config.slice(:host, :socket)}" unless config[:host] == "127.0.0.1" && config[:socket].nil?
              ' )
          done
          mv "$RUNNER_TEMP/dotenv" .env

      # The leg above is trilogy. mysql2 detects the socket differently (it
      # replaces default:'s host line), so check that shape on a bundle-free app.
      - name: Check mysql2 database.yml drops the dummy socket
        if: matrix.name == 'mysql-devise'
        run: |
          cat > "$RUNNER_TEMP/db_only.rb" <<'RUBY'
          apply "#{ENV.fetch("LIB")}/support.rb"
          create_file ".env", ""
          create_file ".env.sample", ""
          apply "#{ENV.fetch("LIB")}/db_credentials.rb"
          RUBY
          cd "$RUNNER_TEMP"
          LIB="$GITHUB_WORKSPACE/rails-app-template/lib/template" SCAFFOLD_DATABASE=mysql \
            rails new mysql2_app --database=mysql --minimal --skip-bundle --skip-git -m db_only.rb > /dev/null
          default=$(sed -n '/^default:/,/^$/p' mysql2_app/config/database.yml)
          if grep -qE '^ +socket: /' mysql2_app/config/database.yml; then
            echo "mysql2 database.yml hardcodes this machine's MySQL socket" >&2; exit 1
          fi
          [ "$(echo "$default" | grep -cxF '  host: <%= ENV.fetch("DB_HOST") { "127.0.0.1" } %>')" = 1 ]
          [ "$(echo "$default" | grep -cxF '  socket: <%= ENV["DB_SOCKET"]&.to_json %>')" = 1 ]

      - name: Boot in development
        working-directory: scaffold_app
        run: bin/rails runner 'puts "development boot ok"'

      - name: Boot in production (eager loading)
        working-directory: scaffold_app
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: bin/rails runner 'puts "production boot ok"'

      # Lives here, not in the shipped home test, so apps can switch drivers
      # without a failing test. A page that renders can't tell drivers apart,
      # nor show that Cuprite's options survived Rails re-registering :cuprite.
      - name: Check the chosen driver is in use (CI-only)
        working-directory: scaffold_app
        run: |
          if [ -d spec ]; then
            cat > spec/system/ci_driver_spec.rb <<'RUBY'
          require "rails_helper"

          RSpec.describe "CI driver check", type: :system do
            it "runs on the chosen driver" do
              visit root_path
              expect(Capybara.current_driver).to eq(:${{ matrix.expected_driver }})
              expect(page.driver.browser.options.process_timeout).to eq(30) if Capybara.current_driver == :cuprite
            end
          end
          RUBY
          else
            cat > test/system/ci_driver_test.rb <<'RUBY'
          require "application_system_test_case"

          class CiDriverTest < ApplicationSystemTestCase
            test "runs on the chosen driver" do
              visit root_path
              assert_equal :${{ matrix.expected_driver }}, Capybara.current_driver
              assert_equal 30, page.driver.browser.options.process_timeout if Capybara.current_driver == :cuprite
            end
          end
          RUBY
          fi
          # Run it on its own and require exactly one passing test: a check
          # file the runner never picks up would otherwise pass by not running.
          if [ -d spec ]; then
            bundle exec rspec spec/system/ci_driver_spec.rb | tee "$RUNNER_TEMP/ci_driver.log"
            grep -q "^1 example, 0 failures" "$RUNNER_TEMP/ci_driver.log"
          else
            bin/rails test test/system/ci_driver_test.rb | tee "$RUNNER_TEMP/ci_driver.log"
            grep -qE "^1 runs, [0-9]+ assertions, 0 failures, 0 errors" "$RUNNER_TEMP/ci_driver.log"
          fi

      - name: Run generated test suite
        working-directory: scaffold_app
        run: |
          if [ -d spec ]; then
            bundle exec rspec
          else
            bin/rails test:all
          fi

      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: scaffold_app/tmp/screenshots
          if-no-files-found: ignore

  # One stable check name for branch protection to require: each matrix leg's
  # check name embeds its parameters, so it changes when a leg is edited.
  template-ok:
    if: always()
    needs: scaffold-matrix
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.scaffold-matrix.result }}" = success
