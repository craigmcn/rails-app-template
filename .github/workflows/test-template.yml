name: Test template

# Verifies rails-app-template itself (not a generated app's own CI, which
# each scaffolded app already gets from `rails new`). Scaffolds a small
# matrix of representative flag combinations and asserts each one boots
# cleanly in development, boots cleanly in production with eager loading on
# (the specific check that would have caught the lib/generators eager-load
# crash — see #12), and passes its own generated test suite.
#
# All matrix legs use --database=sqlite3 except "defaults" (postgresql, via
# the postgres service below) and "mysql-devise" (trilogy, via the mysql
# service below) — those are the combinations db_create.rb/db_credentials.rb
# exist for (Clearance's/Devise's install generators query the database
# directly while generating, and a non-default username/password needs
# config/database.yml patched before that happens). Every CLI option is
# exercised by at least one leg; the full cross-product isn't (see #13).
# mariadb, bun/rollup and postcss are left out on purpose: our template
# code treats them the same as mysql, esbuild/webpack and sass.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "p@ss:word#1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: defaults
            database: postgresql
            expected_driver: selenium_headless_chrome
            extra_args: ""
          - name: devise-tailwind
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--auth=devise --css=tailwind"
          - name: rspec
            database: sqlite3
            expected_driver: cuprite
            # RSpec + cuprite; non-default-options covers Minitest + cuprite,
            # and the remaining legs Minitest + selenium.
            extra_args: "--test=rspec --system-test-driver=cuprite"
          - name: skip-admin-importmap
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--javascript=importmap --skip-admin"
          - name: mysql-devise
            database: trilogy
            expected_driver: selenium_headless_chrome
            extra_args: >-
              --auth=devise --db-username=root
              --db-password=p@ss:word#1
          - name: css-sass-fallback
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--css=sass --no-pagy"
          - name: javascript-webpack
            database: sqlite3
            expected_driver: selenium_headless_chrome
            extra_args: "--javascript=webpack"
          # Every option no other leg covers. Keeps pagy on: bulma is the
          # only --css value that loads its own pagy extra (pagy.rb).
          - name: non-default-options
            database: sqlite3
            expected_driver: cuprite
            extra_args: >-
              --css=bulma --action-text --system-test-driver=cuprite
              --no-rack-attack --no-bullet --no-annotate --port=3999
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout rails-app-template
        uses: actions/checkout@v5
        with:
          path: rails-app-template

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Developers scaffold with Yarn 4, which takes ci_workflow.rb's
      # packageManager path; the image's default Yarn 1 would skip it.
      - name: Activate Yarn 4 via Corepack
        run: |
          npm install -g corepack
          corepack enable
          corepack prepare yarn@4.14.1 --activate
          yarn --version

      - name: Install Rails
        run: gem install rails --no-document

      - name: Scaffold app (${{ matrix.name }})
        run: >-
          rails-app-template/bin/new-rails-app scaffold_app
          --no-interactive
          --database=${{ matrix.database }}
          ${{ matrix.extra_args }}

      # The app's own ci.yml never runs here; check ci_workflow.rb adapted it.
      # `! cmd` never trips bash -e, so negative checks exit explicitly.
      - name: Check generated CI workflow
        working-directory: scaffold_app
        run: |
          ci=.github/workflows/ci.yml
          if [ -d spec ]; then
            grep -qF 'run: bin/rails db:test:prepare test:prepare && bundle exec rspec --exclude-pattern "spec/system/**/*_spec.rb"' "$ci"
            grep -qF 'run: bin/rails db:test:prepare test:prepare && bundle exec rspec spec/system' "$ci"
            if [ -d test ]; then echo "RSpec app still has a test/ dir" >&2; exit 1; fi
          else
            grep -qx '        run: bin/rails db:test:prepare test' "$ci"
          fi
          if [ -f package.json ] && [ ! -f bun.lock ] && [ ! -f bun.lockb ]; then
            if [ "$(grep -c 'node-version-file: .node-version' "$ci")" != 2 ]; then
              echo "expected Node setup in both test jobs" >&2; exit 1
            fi
            # Scaffolded with Yarn 4 (see above), so both must reflect it.
            grep -q '^__metadata:' yarn.lock
            grep -qE '"packageManager": "yarn@4' package.json
          elif grep -q setup-node "$ci"; then
            echo "Node setup added to an app with no package.json" >&2; exit 1
          fi

      # The app's own CI lint job runs this; generator output must pass it too.
      - name: Lint generated app
        working-directory: scaffold_app
        run: bin/rubocop

      # Booting alone wouldn't notice an --no-* flag or --port being ignored.
      - name: Check non-default options took effect
        if: matrix.name == 'non-default-options'
        working-directory: scaffold_app
        run: |
          grep -qx "PORT=3999" .env
          grep -q '"cuprite"' Gemfile
          # `! cmd` never trips bash -e, so the negative check exits explicitly.
          if grep -qE '"(rack-attack|bullet|annotaterb)"' Gemfile; then
            echo "a --no-* gem is still in the Gemfile" >&2; exit 1
          fi
          ls db/migrate | grep -q create_active_storage_tables
          ls db/migrate | grep -q create_action_text_tables

      - name: Boot in development
        working-directory: scaffold_app
        run: bin/rails runner 'puts "development boot ok"'

      - name: Boot in production (eager loading)
        working-directory: scaffold_app
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: bin/rails runner 'puts "production boot ok"'

      # Lives here, not in the shipped home test, so apps can switch drivers
      # without a failing test. A page that renders can't tell drivers apart.
      - name: Check the chosen driver is in use (CI-only)
        working-directory: scaffold_app
        run: |
          if [ -d spec ]; then
            cat > spec/system/ci_driver_spec.rb <<'RUBY'
          require "rails_helper"

          RSpec.describe "CI driver check", type: :system do
            it "runs on the chosen driver" do
              visit root_path
              expect(Capybara.current_driver).to eq(:${{ matrix.expected_driver }})
            end
          end
          RUBY
          else
            cat > test/system/ci_driver_test.rb <<'RUBY'
          require "application_system_test_case"

          class CiDriverTest < ApplicationSystemTestCase
            test "runs on the chosen driver" do
              visit root_path
              assert_equal :${{ matrix.expected_driver }}, Capybara.current_driver
            end
          end
          RUBY
          fi
          # Run it on its own and require exactly one passing test: a check
          # file the runner never picks up would otherwise pass by not running.
          if [ -d spec ]; then
            bundle exec rspec spec/system/ci_driver_spec.rb | tee "$RUNNER_TEMP/ci_driver.log"
            grep -q "^1 example, 0 failures" "$RUNNER_TEMP/ci_driver.log"
          else
            bin/rails test test/system/ci_driver_test.rb | tee "$RUNNER_TEMP/ci_driver.log"
            grep -qE "^1 runs, [0-9]+ assertions, 0 failures, 0 errors" "$RUNNER_TEMP/ci_driver.log"
          fi

      - name: Run generated test suite
        working-directory: scaffold_app
        run: |
          if [ -d spec ]; then
            bundle exec rspec
          else
            bin/rails test:all
          fi

      - name: Upload system test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.name }}
          path: scaffold_app/tmp/screenshots
          if-no-files-found: ignore
